name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch or commit to build'
        required: false
        default: 'main'

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          submodules: false
          fetch-depth: 1

      - name: Get version from package.json
        id: pkg-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building OffgridMobile version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios && pod install

      - name: Sync version to Xcode project
        run: |
          VERSION_CODE=$(date +%s)
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = ${{ env.VERSION }};/" \
            ios/OffgridMobile.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $VERSION_CODE;/" \
            ios/OffgridMobile.xcodeproj/project.pbxproj

      - name: Build Xcode project (Code signing disabled)
        run: |
          xcodebuild \
            -workspace ios/OffgridMobile.xcworkspace \
            -scheme OffgridMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/OffgridMobile.app build/Payload/
          cd build
          zip -qr "OffgridMobile-v${{ env.VERSION }}-unsigned.ipa" Payload
          ls -lh "OffgridMobile-v${{ env.VERSION }}-unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffgridMobile-v${{ env.VERSION }}-unsigned-ipa
          path: build/OffgridMobile-v${{ env.VERSION }}-unsigned.ipa
          retention-days: 14
