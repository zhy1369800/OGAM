name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签（如 v0.1.0，留空则自动根据版本生成）'
        type: string
        required: false
        default: ''
      prerelease:
        description: '是否标记为预发布 (Pre-release)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Get version from package.json
        id: pkg-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building OffgridMobile version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          cd ios && pod install

      - name: Sync version to Xcode project
        run: |
          VERSION_CODE=$(date +%s)
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = ${{ env.VERSION }};/" \
            ios/OffgridMobile.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $VERSION_CODE;/" \
            ios/OffgridMobile.xcodeproj/project.pbxproj

      - name: Build Xcode project (Code signing disabled)
        run: |
          xcodebuild \
            -workspace ios/OffgridMobile.xcworkspace \
            -scheme OffgridMobile \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/OffgridMobile.app build/Payload/
          cd build
          zip -qr "OffgridMobile-v${{ env.VERSION }}-unsigned.ipa" Payload
          ls -lh "OffgridMobile-v${{ env.VERSION }}-unsigned.ipa"

      - name: Upload Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OffgridMobile-v${{ env.VERSION }}-unsigned-ipa
          path: build/OffgridMobile-v${{ env.VERSION }}-unsigned.ipa
          retention-days: 14

      - name: Publish to GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_TAG="${{ inputs.release_tag }}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="v${{ env.VERSION }}"
          fi

          echo "Target Release Tag: $TARGET_TAG"
          IPA_PATH="build/OffgridMobile-v${{ env.VERSION }}-unsigned.ipa"

          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release $TARGET_TAG already exists, uploading IPA..."
            gh release upload "$TARGET_TAG" "$IPA_PATH" --clobber
          else
            echo "Creating new release $TARGET_TAG..."
            gh release create "$TARGET_TAG" "$IPA_PATH" \
              --title "$TARGET_TAG" \
              --notes "Unsigned iOS IPA build ($TARGET_TAG)" \
              $PRERELEASE_FLAG
          fi
